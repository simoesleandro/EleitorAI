version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    # Group all minor/patch updates into a single PR.
    # Major bumps still get individual PRs (need manual testing).
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Ignore major bumps for libs with breaking changes that need manual review.
    # These will need to be updated manually after testing.
    ignore:
      - dependency-name: "langgraph"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google-genai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai-whisper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langfuse"
        update-types: ["version-update:semver-major"]
      - dependency-name: "yt-dlp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    # Only patch updates for Docker base images - major Python version
    # bumps require testing the whole stack.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
